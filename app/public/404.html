<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Declara ambos temas antes de pintar (evita el destello blanco en modo oscuro) y respeta el tamaño de texto del sistema. -->
<meta name="color-scheme" content="light dark">
<meta name="text-scale" content="scale">
<title>Página no encontrada · Apuntor</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121413" media="(prefers-color-scheme: dark)">
<style>
:root{color-scheme:light dark;--bg:#FAF9F6;--text:#1C1C1E;--muted:#6B6B72;--primary:#1D7568;--on-primary:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#121413;--text:#F2F2F0;--muted:#A9AEAC;--primary:#4DB6A6;--on-primary:#0B1F1C}}
*{box-sizing:border-box}
body{margin:0;font-size-adjust:from-font;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--text);font:400 1rem/1.6 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;text-align:center}
h1{font-size:1.75rem;line-height:2.125rem;font-weight:800;margin:0 0 12px}
p{color:var(--muted);margin:0 0 24px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:700;text-decoration:none}
a:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>No encontramos esta página</h1>
<p>Puede que el enlace esté mal escrito o que la página ya no exista.</p>
<a href="/">Ir a Apuntor</a>
</main>
</body>
</html>
